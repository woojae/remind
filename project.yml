# Xcode project for the two apps. The Mac app is still built by `make app`;
# this exists so the iOS app can be signed and run on a phone.
#
#   make xcodeproj      # -> Remind.xcodeproj (regenerate after adding files)
#
# Remind.xcodeproj is generated and ignored by git; this file is the source.
name: Remind
options:
  bundleIdPrefix: com.wlee
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple ID's team in Xcode (target › Signing & Capabilities),
    # or put the ten-character team id here.
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  RemindiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - Info.plist
      - path: App
        excludes:
          - Info.plist
          - Fonts
          - Fonts/**
          - mkicon.swift
          # Mac-only: the timer-based notifier, scenes, settings window, snapshots.
          - Notifier.swift
          - RemindApp.swift
          - SettingsView.swift
          - Snapshot.swift
      - path: App/Fonts
        type: folder
      - Sources/Store.swift
      - Sources/DateParse.swift
    settings:
      base:
        PRODUCT_NAME: Remind
        PRODUCT_BUNDLE_IDENTIFIER: com.wlee.remind.ios
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  Remind:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Fonts
          - Fonts/**
          - mkicon.swift
      - path: App/Fonts
        type: folder
      - Sources/Store.swift
      - Sources/DateParse.swift
    settings:
      base:
        PRODUCT_NAME: Remind
        PRODUCT_BUNDLE_IDENTIFIER: com.wlee.remind.app
        INFOPLIST_FILE: App/Info.plist
        ENABLE_HARDENED_RUNTIME: NO
    preBuildScripts:
      - name: Render app icon
        script: |
          cd "$SRCROOT" && make icon
        outputFiles:
          - $(SRCROOT)/.build/AppIcon.icns
    postBuildScripts:
      - name: Copy app icon
        script: |
          cp "$SRCROOT/.build/AppIcon.icns" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppIcon.icns"
